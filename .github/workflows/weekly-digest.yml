name: Weekly Paper Digest

on:
  schedule:
    - cron: '0 14 * * 0'   # Sunday 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests anthropic

      - name: Run weekly digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/weekly_digest.py

      - name: Commit and push if changed
        run: |
          git config user.name  "weekly-digest-bot"
          git config user.email "actions@github.com"
          git add reading/index.html
          git diff --cached --quiet && echo "No changes — skipping commit." || (
            git commit -m "Weekly paper digest: $(date -u +%Y-%m-%d)" &&
            git push
          )
